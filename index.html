<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>园艺图鉴 · 月季与多肉</title>
<style>
  /* ===== 基础 Reset ===== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sidebar-w: 220px;
    --header-h: 56px;
    --accent: #c0392b;
    --accent-light: #e74c3c;
    --bg: #f7f4f0;
    --sidebar-bg: #2c1a1a;
    --sidebar-active: #5a1a1a;
    --card-bg: #fff;
    --text: #333;
    --text-muted: #888;
    --radius: 10px;
    --shadow: 0 2px 12px rgba(0,0,0,.10);
    --shadow-hover: 0 6px 24px rgba(0,0,0,.18);
  }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* ===== 桌面端顶栏 ===== */
  header {
    height: var(--header-h);
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 12px;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
    z-index: 100;
  }
  header .logo { font-size: 20px; }
  header h1 { font-size: 18px; font-weight: 600; letter-spacing: .05em; }
  header .search-wrap {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header input[type=search] {
    padding: 6px 14px;
    border: none;
    border-radius: 20px;
    font-size: 13px;
    width: 220px;
    outline: none;
    background: rgba(255,255,255,.2);
    color: #fff;
  }
  header input[type=search]::placeholder { color: rgba(255,255,255,.65); }
  header input[type=search]:focus { background: rgba(255,255,255,.3); }

  /* ===== 移动端顶部导航条（默认隐藏）===== */
  #mobile-nav { display: none; }

  /* ===== 主布局 ===== */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
    height: calc(100vh - var(--header-h));
  }

  /* ===== 左侧分类（桌面端） ===== */
  nav#sidebar {
    width: var(--sidebar-w);
    background: var(--sidebar-bg);
    color: #ddd;
    overflow-y: auto;
    flex-shrink: 0;
    padding: 12px 0 24px;
  }
  nav#sidebar h2 {
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #888;
    padding: 16px 18px 8px;
  }
  nav#sidebar .cat-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    cursor: pointer;
    font-size: 14px;
    border-left: 3px solid transparent;
    transition: background .15s, border-color .15s;
    line-height: 1.3;
  }
  nav#sidebar .cat-item:hover { background: rgba(255,255,255,.07); }
  nav#sidebar .cat-item.active {
    background: var(--sidebar-active);
    border-left-color: var(--accent-light);
    color: #fff;
  }
  nav#sidebar .cat-item .icon { font-size: 16px; flex-shrink: 0; }
  nav#sidebar .cat-item .label { flex: 1; }
  nav#sidebar .cat-item .count {
    font-size: 11px;
    background: rgba(255,255,255,.12);
    padding: 1px 6px;
    border-radius: 10px;
    color: #aaa;
  }
  nav#sidebar .cat-item.active .count {
    background: rgba(255,255,255,.22);
    color: #fff;
  }

  /* ===== 右侧主区域 ===== */
  main#content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
  }

  .section-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 18px;
    border-bottom: 2px solid var(--accent);
    padding-bottom: 8px;
  }
  .section-header h2 { font-size: 20px; color: var(--accent); }
  .section-header .total { font-size: 13px; color: var(--text-muted); }

  /* ===== 卡片网格 ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    cursor: pointer;
    overflow: hidden;
    transition: transform .2s, box-shadow .2s;
    display: flex;
    flex-direction: column;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
  }
  .card .thumb {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    background: #eee;
    display: block;
  }
  .card .no-thumb {
    width: 100%;
    aspect-ratio: 4/3;
    background: linear-gradient(135deg, #f0e8e8, #e8d5d5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    color: #c9a0a0;
  }
  .card .card-title {
    padding: 8px 10px;
    font-size: 12.5px;
    line-height: 1.45;
    color: #444;
    word-break: break-all;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex: 1;
  }

  /* ===== 无匹配提示 ===== */
  .empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 60px 0;
    color: var(--text-muted);
    font-size: 15px;
  }

  /* ===== 弹窗 ===== */
  #modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 9000;
    backdrop-filter: blur(3px);
    align-items: center;
    justify-content: center;
  }
  #modal-overlay.open { display: flex; }

  #modal-box {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 12px 48px rgba(0,0,0,.35);
    width: min(92vw, 1080px);
    height: min(90vh, 800px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    animation: fadeIn .18s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(.96) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  #modal-header {
    display: flex;
    align-items: center;
    padding: 10px 16px;
    background: var(--accent);
    color: #fff;
    gap: 10px;
    flex-shrink: 0;
  }
  #modal-title {
    flex: 1;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #modal-close {
    background: rgba(255,255,255,.2);
    border: none;
    color: #fff;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background .15s;
  }
  #modal-close:hover { background: rgba(255,255,255,.4); }

  #modal-iframe {
    flex: 1;
    border: none;
    width: 100%;
    background: #fff;
  }

  /* ===== 加载状态 ===== */
  #loading {
    position: fixed;
    inset: 0;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 99999;
    gap: 16px;
  }
  #loading .spinner {
    width: 48px; height: 48px;
    border: 4px solid #f0e0e0;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { color: #888; font-size: 14px; }

  /* ===== 滚动条美化 ===== */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #aaa; }
  nav#sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); }

/* ============================================
   移动端响应式：≤768px
   ============================================ */
@media (max-width: 768px) {
  /* 隐藏桌面端 header 和 sidebar */
  header { display: none; }
  nav#sidebar { display: none; }

  /* 显示移动端导航 */
  #mobile-nav {
    display: flex;
    flex-direction: column;
    width: 100%;
    background: var(--accent);
    color: #fff;
    flex-shrink: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
    position: sticky;
    top: 0;
  }

  /* 移动端分类横向滚动条 */
  #mobile-nav .cat-scroll {
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none; /* Firefox */
    gap: 0;
    padding: 0 4px;
    scroll-behavior: smooth;
  }
  #mobile-nav .cat-scroll::-webkit-scrollbar { display: none; }

  #mobile-nav .cat-chip {
    flex-shrink: 0;
    padding: 12px 16px;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 3px solid transparent;
    transition: background .15s, border-color .15s;
    color: rgba(255,255,255,.8);
    user-select: none;
    -webkit-user-select: none;
    font-weight: 500;
  }
  #mobile-nav .cat-chip:hover {
    background: rgba(255,255,255,.1);
    color: #fff;
  }
  #mobile-nav .cat-chip.active {
    border-bottom-color: #fff;
    color: #fff;
    font-weight: 700;
    background: rgba(255,255,255,.08);
  }

  /* 移动端搜索框 */
  #mobile-nav .search-bar {
    display: flex;
    align-items: center;
    padding: 8px 12px 10px;
    gap: 8px;
  }
  #mobile-nav .search-bar input[type=search] {
    flex: 1;
    padding: 9px 16px;
    border: none;
    border-radius: 20px;
    font-size: 14px;
    outline: none;
    background: rgba(255,255,255,.2);
    color: #fff;
  }
  #mobile-nav .search-bar input[type=search]::placeholder { color: rgba(255,255,255,.65); }
  #mobile-nav .search-bar input[type=search]:focus { background: rgba(255,255,255,.35); }

  /* 主内容区调整 */
  .layout {
    flex-direction: column;
    height: auto;
    overflow: visible;
  }
  main#content {
    padding: 16px 12px;
    overflow-y: visible;
    height: auto;
  }
  .grid {
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }
  .section-header h2 { font-size: 17px; }
}

/* 超小屏幕进一步缩小卡片 */
@media (max-width: 420px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .card .card-title { font-size: 11.5px; padding: 6px 8px; }
}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>正在加载图鉴数据…</p>
</div>

<!-- 桌面端顶栏 -->
<header>
  <span class="logo">🌿</span>
  <h1>园艺图鉴 · 月季与多肉</h1>
  <div class="search-wrap">
    <input type="search" id="search-input" placeholder="搜索条目名称…" autocomplete="off">
  </div>
</header>

<!-- 移动端导航条：横向滑动分类 + 搜索框 -->
<div id="mobile-nav">
  <div class="cat-scroll" id="mobile-cat-scroll">
    <!-- JS 动态生成分类 chips -->
  </div>
  <div class="search-bar">
    <input type="search" id="mobile-search-input" placeholder="搜索条目名称…" autocomplete="off">
  </div>
</div>

<!-- 主布局 -->
<div class="layout">

  <!-- 左侧分类（桌面端） -->
  <nav id="sidebar">
    <h2>分类导航</h2>
    <div id="cat-list"><!-- JS 生成 --></div>
  </nav>

  <!-- 右侧内容 -->
  <main id="content">
    <div class="section-header">
      <h2 id="section-title">全部条目</h2>
      <span class="total" id="section-count"></span>
    </div>
    <div class="grid" id="grid"><!-- JS 生成 --></div>
  </main>
</div>

<!-- 阅读弹窗 -->
<div id="modal-overlay">
  <div id="modal-box">
    <div id="modal-header">
      <span id="modal-title">文章标题</span>
      <button id="modal-close" title="关闭 (Esc)">✕</button>
    </div>
    <iframe id="modal-iframe" sandbox="allow-same-origin allow-scripts allow-popups"></iframe>
  </div>
</div>

<script>
/* ==================== 主逻辑 ==================== */

let allData = [];      // 全部分类数据
let activeCatIdx = -1; // -1 = 全部

/* 加载数据 */
async function loadData() {
  try {
    const res = await fetch('./data/index.json');
    if (!res.ok) throw new Error('data/index.json 未找到');
    const rawData = await res.json();
    // 把扁平数组转换成按分类分组的结构
    allData = transformData(rawData);
    init();
  } catch (e) {
    document.getElementById('loading').innerHTML =
      `<p style="color:#c0392b;font-size:16px;">⚠️ 数据加载失败：${e.message}</p>
       <p style="margin-top:8px;font-size:13px;color:#888;">
         请确认 data/index.json 文件存在且格式正确。
       </p>`;
  }
}

/* 数据转换：扁平数组 → 按分类分组 */
function transformData(rawData) {
  // 分类映射表（可扩展）
  const catIcons = {
    '丹陶': '🌹', '科尔德斯': '🌹', '奥斯汀': '🌹', '玫昂': '🌹',
    '戴尔巴德': '🌹', '吉洛': '🌹', '其他育种家': '🌹',
    '竞赛,评选以及月季园实测': '🏆', '种植分享': '🌱',
    '育种相关': '🔬', '多肉': '🌵'
  };

  // 按 cat 字段分组
  const groups = {};
  rawData.forEach(item => {
    const catName = item.cat || '未分类';
    if (!groups[catName]) {
      groups[catName] = {
        name: catName,
        icon: catIcons[catName] || '📄',
        items: []
      };
    }
    groups[catName].items.push({
      title: item.title,
      thumb: item.images && item.images.length > 0 ? item.images[0] : '',
      file_url: `./detail.html?id=${item.id}`  // 详情页链接
    });
  });

  // 转换为数组，按特定顺序排序
  const order = ['丹陶', '科尔德斯', '奥斯汀', '玫昂', '戴尔巴德', '吉洛', '其他育种家',
                 '竞赛,评选以及月季园实测', '种植分享', '育种相关', '多肉'];
  const result = [];
  // 先按预设顺序添加
  order.forEach(name => {
    if (groups[name]) {
      result.push(groups[name]);
      delete groups[name];
    }
  });
  // 再添加剩余分类
  Object.values(groups).forEach(g => result.push(g));

  return result;
}

/* 初始化 */
function init() {
  document.getElementById('loading').style.display = 'none';
  renderSidebar();
  renderMobileNav();
  renderGrid(-1);
  bindEvents();
}

/* 渲染桌面端左侧分类列表 */
function renderSidebar() {
  const container = document.getElementById('cat-list');
  // "全部" 项
  const allCount = allData.reduce((s, c) => s + c.items.length, 0);
  container.innerHTML = `
    <div class="cat-item active" data-idx="-1">
      <span class="icon">📚</span>
      <span class="label">全部条目</span>
      <span class="count">${allCount}</span>
    </div>`;

  allData.forEach((cat, idx) => {
    const div = document.createElement('div');
    div.className = 'cat-item';
    div.dataset.idx = idx;
    div.innerHTML = `
      <span class="icon">${cat.icon || '📄'}</span>
      <span class="label">${cat.name}</span>
      <span class="count">${cat.items.length}</span>`;
    container.appendChild(div);
  });
}

/* 渲染移动端横向分类条 */
function renderMobileNav() {
  const scrollContainer = document.getElementById('mobile-cat-scroll');
  // "全部" 项
  const allCount = allData.reduce((s, c) => s + c.items.length, 0);
  const allChip = document.createElement('div');
  allChip.className = 'cat-chip active';
  allChip.dataset.idx = '-1';
  allChip.textContent = `全部 (${allCount})`;
  scrollContainer.appendChild(allChip);

  allData.forEach((cat, idx) => {
    const chip = document.createElement('div');
    chip.className = 'cat-chip';
    chip.dataset.idx = idx;
    chip.textContent = `${cat.icon || '📄'} ${cat.name} (${cat.items.length})`;
    scrollContainer.appendChild(chip);
  });
}

/* 渲染右侧卡片网格 */
function renderGrid(catIdx, keyword = '') {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  let items = [];
  let title = '全部条目';

  if (catIdx === -1) {
    allData.forEach(cat => {
      cat.items.forEach(item => items.push({ ...item, _cat: cat.name }));
    });
    title = '全部条目';
  } else {
    const cat = allData[catIdx];
    items = cat.items.map(item => ({ ...item, _cat: cat.name }));
    title = `${cat.icon || ''} ${cat.name}`;
  }

  // 关键词过滤
  if (keyword) {
    const kw = keyword.toLowerCase();
    items = items.filter(item => item.title.toLowerCase().includes(kw));
    title = `"${keyword}" 的搜索结果`;
  }

  document.getElementById('section-title').textContent = title;
  document.getElementById('section-count').textContent = `共 ${items.length} 篇`;

  if (!items.length) {
    grid.innerHTML = '<div class="empty">暂无匹配条目</div>';
    return;
  }

  const frag = document.createDocumentFragment();
  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    card.title = item.title;
    card.dataset.url = item.file_url;
    card.dataset.title = item.title;

    const thumbHtml = item.thumb
      ? `<img class="thumb" src="${item.thumb}" alt="${item.title}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=no-thumb>🌸</div>'">`
      : `<div class="no-thumb">🌸</div>`;

    card.innerHTML = `${thumbHtml}<div class="card-title">${escHtml(item.title)}</div>`;
    frag.appendChild(card);
  });
  grid.appendChild(frag);
}

/* HTML 转义 */
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* 同步桌面端和移动端的分类高亮 + 滚动到激活项 */
function setActiveCategory(idx) {
  activeCatIdx = idx;

  // 桌面端 sidebar
  document.querySelectorAll('#sidebar .cat-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.idx) === idx);
  });

  // 移动端 chips
  document.querySelectorAll('#mobile-cat-scroll .cat-chip').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.idx) === idx);
  });

  // 移动端：将激活的 chip 滚动到可视区域
  const activeChip = document.querySelector('#mobile-cat-scroll .cat-chip.active');
  if (activeChip) {
    activeChip.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }
}

/* 绑定事件 */
function bindEvents() {
  // 桌面端分类点击
  document.getElementById('cat-list').addEventListener('click', e => {
    const item = e.target.closest('.cat-item');
    if (!item) return;
    const idx = parseInt(item.dataset.idx);
    setActiveCategory(idx);
    renderGrid(idx, document.getElementById('search-input').value.trim());
    document.getElementById('content').scrollTo(0, 0);
  });

  // 移动端分类点击
  document.getElementById('mobile-cat-scroll').addEventListener('click', e => {
    const chip = e.target.closest('.cat-chip');
    if (!chip) return;
    const idx = parseInt(chip.dataset.idx);
    setActiveCategory(idx);
    const keyword = document.getElementById('mobile-search-input').value.trim();
    renderGrid(idx, keyword);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // 桌面端搜索
  let searchTimer;
  document.getElementById('search-input').addEventListener('input', e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      renderGrid(activeCatIdx, e.target.value.trim());
      document.getElementById('content').scrollTo(0, 0);
    }, 250);
  });

  // 移动端搜索
  let mobileSearchTimer;
  document.getElementById('mobile-search-input').addEventListener('input', e => {
    clearTimeout(mobileSearchTimer);
    mobileSearchTimer = setTimeout(() => {
      renderGrid(activeCatIdx, e.target.value.trim());
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 250);
  });

  // 卡片点击 → 弹窗
  document.getElementById('grid').addEventListener('click', e => {
    const card = e.target.closest('.card');
    if (!card) return;
    openModal(card.dataset.url, card.dataset.title);
  });

  // 关闭弹窗
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });
}

/* 打开弹窗 */
function openModal(url, title) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-iframe').src = url;
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

/* 关闭弹窗 */
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.getElementById('modal-iframe').src = 'about:blank';
  document.body.style.overflow = '';
