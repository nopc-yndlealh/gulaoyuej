<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>园艺植物图鉴</title>
<style>
:root {
  --bg: #f8f7f4;
  --sidebar-bg: #fff;
  --card-bg: #fff;
  --text: #2c2c2c;
  --text-muted: #888;
  --border: #e8e5df;
  --accent: #4a7c59;
  --accent-light: #e8f5e9;
  --hover: #f0ede6;
  --shadow: 0 1px 3px rgba(0,0,0,0.06);
  --modal-bg: rgba(0,0,0,0.5);
  --rose-color: #c0392b;
  --succulent-color: #2e7d32;
}

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; }

/* 侧边栏 */
.sidebar {
  width: 260px; min-width: 260px; height: 100vh; background: var(--sidebar-bg);
  border-right: 1px solid var(--border); display: flex; flex-direction: column;
  overflow: hidden; z-index: 10;
}
.sidebar-header {
  padding: 20px 16px; border-bottom: 1px solid var(--border);
}
.sidebar-header h1 {
  font-size: 18px; font-weight: 600; color: var(--accent); letter-spacing: 0.5px;
}
.sidebar-header p { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
.nav-cat { padding: 0 12px; }
.nav-cat-title {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500;
  transition: background 0.15s; user-select: none; color: var(--text);
}
.nav-cat-title:hover { background: var(--hover); }
.nav-cat-title.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
.nav-cat-arrow { font-size: 10px; transition: transform 0.2s; color: var(--text-muted); }
.nav-cat-title.open .nav-cat-arrow { transform: rotate(90deg); }
.nav-cat-icon { width: 20px; text-align: center; font-size: 16px; }
.nav-cat-count { margin-left: auto; font-size: 11px; color: var(--text-muted); background: var(--bg); padding: 2px 8px; border-radius: 10px; }
.nav-sub { overflow: hidden; max-height: 0; transition: max-height 0.3s ease; }
.nav-sub.open { max-height: 2000px; }
.nav-sub-item {
  display: block; padding: 8px 12px 8px 44px; font-size: 13px; color: var(--text-muted);
  cursor: pointer; border-radius: 6px; margin: 2px 8px; transition: all 0.15s;
}
.nav-sub-item:hover { background: var(--hover); color: var(--text); }
.nav-sub-item.active { background: var(--accent-light); color: var(--accent); font-weight: 500; }

/* 主区域 */
.main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* 搜索栏 */
.search-bar {
  padding: 16px 24px; background: var(--sidebar-bg); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; flex-shrink: 0;
}
.search-input {
  flex: 1; padding: 10px 16px; border: 1px solid var(--border); border-radius: 10px;
  font-size: 14px; outline: none; background: var(--bg); color: var(--text);
  transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--accent); }
.search-info { font-size: 13px; color: var(--text-muted); white-space: nowrap; }

/* 卡片网格 */
.content-area { flex: 1; overflow-y: auto; padding: 20px 24px; }
.card-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.card {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
  cursor: pointer; transition: all 0.2s; position: relative;
  overflow: hidden; display: flex; flex-direction: column;
}
.card:hover { border-color: var(--accent); box-shadow: var(--shadow); transform: translateY(-1px); }
.card-img {
  width: 100%; height: 180px; object-fit: cover; background: var(--bg);
  flex-shrink: 0;
}
.card-img-placeholder {
  width: 100%; height: 180px; display: flex; align-items: center; justify-content: center;
  font-size: 48px; background: var(--bg); color: #ccc; flex-shrink: 0;
}
.card-body { padding: 16px 20px 20px; flex: 1; }
.card-badge {
  display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 12px;
  margin-bottom: 10px; font-weight: 500;
}
.card-badge.rose { background: #fce4ec; color: var(--rose-color); }
.card-badge.succulent { background: #e8f5e9; color: var(--succulent-color); }
.card-title { font-size: 15px; font-weight: 500; line-height: 1.4; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-meta { font-size: 12px; color: var(--text-muted); }
.card-source { font-size: 11px; color: #bbb; margin-top: 4px; }

/* 模态框 */
.modal-overlay {
  position: fixed; inset: 0; background: var(--modal-bg); z-index: 100;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.2s ease;
}
.modal-overlay.hidden { display: none; }
@keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
.modal {
  background: var(--sidebar-bg); border-radius: 16px; width: min(800px, 90vw);
  max-height: 85vh; display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.15);
}
.modal-header {
  padding: 20px 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; justify-content: space-between;
}
.modal-title { font-size: 18px; font-weight: 600; line-height: 1.4; flex: 1; padding-right: 16px; }
.modal-close {
  width: 32px; height: 32px; border: none; background: var(--bg); border-radius: 8px;
  cursor: pointer; font-size: 18px; color: var(--text-muted); display: flex;
  align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s;
}
.modal-close:hover { background: #e0e0e0; color: var(--text); }
.modal-body {
  flex: 1; overflow-y: auto; padding: 24px; font-size: 14px; line-height: 1.8;
}
.modal-body-text { white-space: pre-wrap; word-break: break-word; }
.modal-images {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;
}
.modal-images img {
  max-width: 100%; max-height: 300px; border-radius: 8px; object-fit: contain;
  border: 1px solid var(--border);
}
.modal-footer {
  padding: 12px 24px; border-top: 1px solid var(--border); font-size: 12px;
  color: var(--text-muted); display: flex; gap: 8px;
}

/* 空状态 */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--text-muted);
}
.empty-state-icon { font-size: 48px; margin-bottom: 16px; }

/* 滚动条 */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #d0cdc4; border-radius: 3px; }

/* 响应式 */
@media (max-width: 768px) {
  .sidebar { width: 220px; min-width: 220px; }
  .card-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
}
@media (max-width: 600px) {
  .sidebar { display: none; }
  .card-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- 侧边栏 -->
<aside class="sidebar">
  <div class="sidebar-header">
    <h1>园艺植物图鉴</h1>
    <p>Rosa &amp; Succulent Reference</p>
  </div>
  <nav class="sidebar-nav" id="sidebarNav">
    <div class="nav-cat">
      <div class="nav-cat-title" data-cat="all" onclick="filterCategory('all', this)">
        <span class="nav-cat-icon">&#x1f331;</span>全部
        <span class="nav-cat-count" id="countAll">0</span>
      </div>
    </div>
    <div class="nav-cat">
      <div class="nav-cat-title open" data-cat="月季" onclick="toggleSub(this)">
        <span class="nav-cat-arrow">&#9654;</span>
        <span class="nav-cat-icon">&#x1f339;</span>月季
        <span class="nav-cat-count" id="countRose">0</span>
      </div>
      <div class="nav-sub open" id="subRose"></div>
    </div>
    <div class="nav-cat">
      <div class="nav-cat-title" data-cat="多肉植物" onclick="filterCategory('多肉植物', this)">
        <span class="nav-cat-icon">&#x1f335;</span>多肉植物
        <span class="nav-cat-count" id="countSucculent">0</span>
      </div>
    </div>
  </nav>
</aside>

<!-- 主区域 -->
<main class="main">
  <div class="search-bar">
    <input type="text" class="search-input" id="searchInput" placeholder="搜索品种名称..." oninput="doSearch()">
    <span class="search-info" id="searchInfo">共 0 篇</span>
  </div>
  <div class="content-area" id="contentArea">
    <div class="card-grid" id="cardGrid"></div>
  </div>
</main>

<!-- 模态框 -->
<div class="modal-overlay hidden" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <span id="modalCat"></span>
      <span id="modalSource"></span>
    </div>
  </div>
</div>

<script>
// 全局状态
let allItems = [];
let contentCache = {};
let currentFilter = 'all';
let currentSearch = '';

// 加载数据
async function loadData() {
  try {
    const resp = await fetch('data/index.json');
    allItems = await resp.json();
    updateCounts();
    renderSidebar();
    renderCards(allItems);
    document.getElementById('searchInfo').textContent = `共 ${allItems.length} 篇`;
  } catch(e) {
    document.getElementById('cardGrid').innerHTML =
      '<div class="empty-state"><div class="empty-state-icon">&#x1f4e6;</div><p>数据加载失败，请确保 data/index.json 文件存在</p></div>';
  }
}

// 更新计数
function updateCounts() {
  let roseCount = 0, succCount = 0;
  allItems.forEach(item => {
    if (item.type === '月季') roseCount++;
    else if (item.type === '多肉植物') succCount++;
  });
  document.getElementById('countAll').textContent = allItems.length;
  document.getElementById('countRose').textContent = roseCount;
  document.getElementById('countSucculent').textContent = succCount;
}

// 渲染侧边栏子分类
function renderSidebar() {
  const subContainer = document.getElementById('subRose');
  const roseSubs = {};
  allItems.filter(i => i.type === '月季').forEach(i => {
    const sub = i.cat || '其他';
    if (!roseSubs[sub]) roseSubs[sub] = 0;
    roseSubs[sub]++;
  });
  let html = '';
  for (const [sub, count] of Object.entries(roseSubs)) {
    html += `<div class="nav-sub-item" data-sub="${sub}" onclick="filterSubCategory('${sub}', this)">${sub} <span style="font-size:11px;color:#bbb;margin-left:4px;">${count}</span></div>`;
  }
  subContainer.innerHTML = html;
}

// 切换子分类展开/折叠
function toggleSub(el) {
  el.classList.toggle('open');
  el.nextElementSibling.classList.toggle('open');
}

// 过滤：全部分类
function filterCategory(cat, el) {
  document.querySelectorAll('.nav-cat-title').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.nav-sub-item').forEach(e => e.classList.remove('active'));
  if (el) el.classList.add('active');
  currentFilter = cat;
  applyFilters();
}

// 过滤：子分类
function filterSubCategory(sub, el) {
  document.querySelectorAll('.nav-cat-title').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.nav-sub-item').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  currentFilter = sub;
  applyFilters();
}

// 搜索
function doSearch() {
  currentSearch = document.getElementById('searchInput').value.trim().toLowerCase();
  applyFilters();
}

// 应用过滤和搜索
function applyFilters() {
  let filtered = allItems;

  if (currentFilter === 'all') {
    // 显示全部
  } else if (currentFilter === '月季') {
    filtered = allItems.filter(i => i.type === '月季');
  } else if (currentFilter === '多肉植物') {
    filtered = allItems.filter(i => i.type === '多肉植物');
  } else {
    // 月季子分类
    filtered = allItems.filter(i => i.cat === currentFilter);
  }

  if (currentSearch) {
    filtered = filtered.filter(i => i.title.toLowerCase().includes(currentSearch));
  }

  renderCards(filtered);
  document.getElementById('searchInfo').textContent =
    currentSearch ? `搜索 "${currentSearch}" - ${filtered.length} 篇` : `共 ${filtered.length} 篇`;
}

// 渲染卡片
function renderCards(items) {
  const grid = document.getElementById('cardGrid');
  if (items.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#x1f50d;</div><p>没有找到匹配的品种</p></div>';
    return;
  }
  let html = '';
  items.forEach(item => {
    const isRose = item.type === '月季';
    const badgeClass = isRose ? 'rose' : 'succulent';
    const badgeText = isRose ? (item.cat || '月季') : '多肉植物';
    const hasImg = item.images && item.images.length > 0;
    const imgHtml = hasImg
      ? `<img class="card-img" src="${item.images[0]}" alt="${escapeHtml(item.title)}" loading="lazy">`
      : `<div class="card-img-placeholder">${isRose ? '🌹' : '🌵'}</div>`;
    html += `
      <div class="card" onclick="openArticle('${item.id}')">
        ${imgHtml}
        <div class="card-body">
          <span class="card-badge ${badgeClass}">${badgeText}</span>
          <div class="card-title">${escapeHtml(item.title)}</div>
          <div class="card-meta">${escapeHtml(item.cat || '')}</div>
          <div class="card-source">${escapeHtml(item.source || '')}</div>
        </div>
      </div>`;
  });
  grid.innerHTML = html;
}

// 打开文章
async function openArticle(id) {
  const overlay = document.getElementById('modalOverlay');
  document.getElementById('modalTitle').textContent = '加载中...';
  document.getElementById('modalBody').innerHTML = '';
  document.getElementById('modalCat').textContent = '';
  document.getElementById('modalSource').textContent = '';
  overlay.classList.remove('hidden');

  try {
    if (!contentCache[id]) {
      const resp = await fetch('data/content.json');
      const allContent = await resp.json();
      contentCache = allContent;
    }
    const data = contentCache[id];
    if (data) {
      document.getElementById('modalTitle').textContent = data.title;

      // 用 segments 渲染，保持原文顺序
      let bodyHtml = '';
      if (data.segments && data.segments.length > 0) {
        data.segments.forEach(seg => {
          if (seg.t) {
            // 文字段落
            const escaped = escapeHtml(seg.t);
            // 保留换行
            const withBr = escaped.replace(/\n/g, '<br>');
            bodyHtml += `<p style="margin:0 0 12px 0;line-height:1.8;">${withBr}</p>`;
          } else if (seg.i) {
            // 图片
            bodyHtml += `<div style="margin:8px 0;"><img src="${seg.i}" alt="${escapeHtml(data.title)}" style="max-width:100%;border-radius:8px;border:1px solid var(--border);height:auto;"></div>`;
          }
        });
      } else if (data.content) {
        // 兼容旧格式
        bodyHtml = '<p style="margin:0;line-height:1.8;">' + escapeHtml(data.content).replace(/\n/g, '<br>') + '</p>';
      }

      document.getElementById('modalBody').innerHTML = bodyHtml;
      const indexEntry = allItems.find(i => i.id === id);
      const catInfo = indexEntry ? (indexEntry.cat || '') : '';
      document.getElementById('modalCat').textContent = catInfo;
      document.getElementById('modalSource').textContent = indexEntry ? (indexEntry.source || '') : '';
    } else {
      document.getElementById('modalTitle').textContent = '未找到';
      document.getElementById('modalBody').textContent = '该文章内容不存在';
    }
  } catch(e) {
    document.getElementById('modalBody').textContent = '加载内容失败';
  }
}

// 关闭模态框
function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.add('hidden');
}

// ESC关闭
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('modalOverlay').classList.add('hidden');
  }
});

// HTML转义
function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// 初始化
loadData();
</script>
</body>
</html>
