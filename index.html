<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>园艺图鉴 · 月季与多肉</title>
<style>
  /* ===== 基础 Reset ===== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sidebar-w: 220px;
    --header-h: 56px;
    --accent: #c0392b;
    --accent-light: #e74c3c;
    --bg: #f7f4f0;
    --sidebar-bg: #2c1a1a;
    --sidebar-active: #5a1a1a;
    --card-bg: #fff;
    --text: #333;
    --text-muted: #888;
    --radius: 10px;
    --shadow: 0 2px 12px rgba(0,0,0,.10);
    --shadow-hover: 0 6px 24px rgba(0,0,0,.18);
  }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* ===== 桌面端顶栏 ===== */
  header {
    height: var(--header-h);
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 12px;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
    z-index: 100;
  }
  header .logo { font-size: 20px; }
  header h1 { font-size: 18px; font-weight: 600; letter-spacing: .05em; }
  header .search-wrap {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header input[type=search] {
    padding: 6px 14px;
    border: none;
    border-radius: 20px;
    font-size: 13px;
    width: 220px;
    outline: none;
    background: rgba(255,255,255,.2);
    color: #fff;
  }
  header input[type=search]::placeholder { color: rgba(255,255,255,.65); }
  header input[type=search]:focus { background: rgba(255,255,255,.3); }

  /* ===== 移动端顶部导航条（默认隐藏）===== */
  #mobile-nav { display: none; }

  /* ===== 主布局 ===== */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
    height: calc(100vh - var(--header-h));
  }

  /* ===== 左侧分类（桌面端） ===== */
  nav#sidebar {
    width: var(--sidebar-w);
    background: var(--sidebar-bg);
    color: #ddd;
    overflow-y: auto;
    flex-shrink: 0;
    padding: 12px 0 24px;
  }
  nav#sidebar h2 {
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #888;
    padding: 16px 18px 8px;
  }
  nav#sidebar .cat-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    cursor: pointer;
    font-size: 14px;
    border-left: 3px solid transparent;
    transition: background .15s, border-color .15s;
    line-height: 1.3;
  }
  nav#sidebar .cat-item:hover { background: rgba(255,255,255,.07); }
  nav#sidebar .cat-item.active {
    background: var(--sidebar-active);
    border-left-color: var(--accent-light);
    color: #fff;
  }
  nav#sidebar .cat-item .label { flex: 1; }
  nav#sidebar .cat-item .count {
    font-size: 11px;
    background: rgba(255,255,255,.12);
    padding: 1px 6px;
    border-radius: 10px;
    color: #aaa;
  }
  nav#sidebar .cat-item.active .count {
    background: rgba(255,255,255,.22);
    color: #fff;
  }

  /* ===== 树状分类结构 ===== */
  .tree-group { }
  .tree-group .parent-item {
    position: relative;
    font-weight: 600;
    color: #e8d0d0;
  }
  .tree-group .parent-item:hover { background: rgba(255,255,255,.1); }
  .tree-arrow {
    font-size: 10px;
    flex-shrink: 0;
    width: 16px;
    text-align: center;
    transition: transform .2s;
    color: #bbb;
  }
  .tree-children { }
  .leaf-item .label { padding-left: 4px; font-size: 13.5px; }
  .tree-indent {
    width: 20px;
    height: 1px;
    flex-shrink: 0;
  }

  /* ===== 右侧主区域 ===== */
  main#content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
  }

  .section-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 18px;
    border-bottom: 2px solid var(--accent);
    padding-bottom: 8px;
  }
  .section-header h2 { font-size: 20px; color: var(--accent); }
  .section-header .total { font-size: 13px; color: var(--text-muted); }

  /* ===== 卡片网格 ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    cursor: pointer;
    overflow: hidden;
    transition: transform .2s, box-shadow .2s;
    display: flex;
    flex-direction: column;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
  }
  .card .thumb {
    width: 100%;
    height: 140px;
    object-fit: cover;
    background: #eee;
    display: block;
  }
  .card .no-thumb {
    width: 100%;
    height: 140px;
    background: linear-gradient(135deg, #f0e8e8, #e8d5d5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    color: #c9a0a0;
  }
  .card .card-title {
    padding: 8px 10px;
    font-size: 12.5px;
    line-height: 1.45;
    color: #444;
    word-break: break-all;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex: 1;
  }

  /* ===== 无匹配提示 ===== */
  .empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 60px 0;
    color: var(--text-muted);
    font-size: 15px;
  }

  /* ===== 弹窗 ===== */
  #modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 9000;
    backdrop-filter: blur(3px);
    align-items: center;
    justify-content: center;
  }
  #modal-overlay.open { display: flex; }

  #modal-box {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 12px 48px rgba(0,0,0,.35);
    width: min(92vw, 1080px);
    height: min(90vh, 800px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    animation: fadeIn .18s ease;
  }
  @keyframes fadeIn {
    from { opacity:0; transform: scale(.96) translateY(8px); }
    to   { opacity:1; transform: scale(1)  translateY(0); }
  }

  #modal-header {
    display: flex;
    align-items: center;
    padding: 10px 16px;
    background: var(--accent);
    color: #fff;
    gap: 10px;
    flex-shrink: 0;
  }
  #modal-title {
    flex: 1;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #modal-close {
    background: rgba(255,255,255,.2);
    border: none;
    color: #fff;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background .15s;
  }
  #modal-close:hover { background: rgba(255,255,255,.4); }


  /* ===== 详情内联容器 ===== */
  #detail-view {
    flex: 1;
    overflow-y: auto;
    padding: 0;
    background: #fff;
    display: none;
  }
  #detail-view.active { display: block; }
  #detail-view .detail-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    padding: 16px 20px 8px;
    border-bottom: 2px solid var(--accent);
    margin: 0;
  }
  #detail-view .detail-body {
    padding: 12px 20px 24px;
    line-height: 1.8;
    color: #444;
    font-size: 14.5px;
  }
  #detail-view .detail-body p {
    margin: 10px 0;
    text-indent: 2em;
  }
  #detail-view .detail-body img {
    max-width: 100%;
    border-radius: 8px;
    margin: 8px 0;
    box-shadow: 0 2px 8px rgba(0,0,0,.10);
    cursor: pointer;
    transition: transform .2s;
  }
  #detail-view .detail-body img:hover {
    transform: scale(1.02);
  }
  #detail-view .detail-error {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  /* 图片灯箱 */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.85);
    z-index: 99999;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  #lightbox.active { display: flex; }
  #lightbox img {
    max-width: 95vw;
    max-height: 95vh;
    object-fit: contain;
    border-radius: 4px;
  }

  /* ===== 加载状态：用 visibility + opacity 避免抖动 ===== */
  #loading {
    position: fixed;
    inset: 0;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 99999;
    gap: 16px;
    transition: opacity .3s ease, visibility .3s ease;
    opacity: 1;
    visibility: visible;
  }
  #loading.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  #loading .spinner {
    width: 48px; height: 48px;
    border: 4px solid #f0e0e0;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { color: #888; font-size: 14px; }

  /* ===== 滚动条美化 ===== */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #aaa; }
  nav#sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); }

/* ============================================
   移动端响应式：≤768px
   ============================================ */
@media (max-width: 768px) {
  /* 隐藏桌面端 header 和 sidebar */
  header { display: none; }
  nav#sidebar { display: none; }

  /* 显示移动端导航 */
  #mobile-nav {
    display: flex;
    flex-direction: column;
    width: 100%;
    background: var(--accent);
    color: #fff;
    flex-shrink: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }

  /* 移动端分类横向滚动条 */
  #mobile-nav .cat-scroll {
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    gap: 0;
    padding: 0 4px;
  }
  #mobile-nav .cat-scroll::-webkit-scrollbar { display: none; }

  #mobile-nav .cat-chip {
    flex-shrink: 0;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 3px solid transparent;
    transition: background .15s, border-color .15s;
    color: rgba(255,255,255,.8);
    user-select: none;
    -webkit-user-select: none;
  }
  #mobile-nav .cat-chip:hover {
    background: rgba(255,255,255,.1);
    color: #fff;
  }
  #mobile-nav .cat-chip.active {
    border-bottom-color: #fff;
    color: #fff;
    font-weight: 600;
  }

  /* 移动端搜索框 */
  #mobile-nav .search-bar {
    display: flex;
    align-items: center;
    padding: 8px 12px;
    gap: 8px;
  }
  #mobile-nav .search-bar input[type=search] {
    flex: 1;
    padding: 8px 14px;
    border: none;
    border-radius: 20px;
    font-size: 14px;
    outline: none;
    background: rgba(255,255,255,.2);
    color: #fff;
  }
  #mobile-nav .search-bar input[type=search]::placeholder { color: rgba(255,255,255,.65); }
  #mobile-nav .search-bar input[type=search]:focus { background: rgba(255,255,255,.35); }

  /* 主内容区调整 */
  .layout {
    flex-direction: column;
    height: auto;
    overflow: visible;
  }
  main#content {
    padding: 16px 12px;
    overflow-y: visible;
    height: auto;
  }
  .grid {
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }
  .section-header h2 { font-size: 17px; }
}

/* 超小屏幕进一步缩小卡片 */
@media (max-width: 420px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .card .card-title { font-size: 11.5px; padding: 6px 8px; }
}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>正在加载图鉴数据…</p>
</div>

<!-- 桌面端顶栏 -->
<header>
  <h1>园艺图鉴</h1>
  <div class="search-wrap">
    <input type="search" id="search-input" placeholder="搜索月季 / 多肉…">
  </div>
</header>

<!-- 移动端导航条 -->
<div id="mobile-nav">
  <div class="cat-scroll" id="mobile-cat-scroll"></div>
  <div class="search-bar">
    <input type="search" id="mobile-search-input" placeholder="搜索月季 / 多肉…">
  </div>
</div>

<!-- 主布局 -->
<div class="layout">
  <!-- 桌面端左侧分类 -->
  <nav id="sidebar">
    <h2>分　类</h2>
    <div id="cat-list"></div>
  </nav>
  <!-- 右侧内容 -->
  <main id="content">
    <div class="section-header">
      <h2 id="section-title">全部条目</h2>
      <span class="total" id="total-count"></span>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<!-- 弹窗 -->
<div id="modal-overlay">
  <div id="modal-box">
    <div id="modal-header">
      <span id="modal-title">详情</span>
      <button id="modal-close">×</button>
    </div>
    <div id="detail-view"></div>
  </div>
</div>

<!-- 图片灯箱 -->
<div id="lightbox"></div>

<script>
/* ==================== 主逻辑 ==================== */
(function() {
  'use strict';

let allData = null;     // 树状分类数据 { tree, flatGroups, totalItems }
let contentData = {};   // 详情内容数据（content.json）
let activeCatIdx = -1;  // -1 = 全部，格式: "group-child" 如 "月季-丹陶" 或 "多肉"

/* 加载数据 */
async function loadData() {
  try {
    const [indexRes, contentRes] = await Promise.all([
      fetch('./data/index.json'),
      fetch('./data/content.json')
    ]);
    if (!indexRes.ok) throw new Error('data/index.json 未找到');
    if (!contentRes.ok) throw new Error('data/content.json 未找到');

    const rawData = await indexRes.json();
    contentData = await contentRes.json();
    allData = transformData(rawData);
    init();
  } catch (e) {
    document.getElementById('loading').innerHTML =
      `<p style="color:#c0392b;font-size:16px;">数据加载失败：${e.message}</p>
       <p style="margin-top:8px;font-size:13px;color:#888;">
         请确认 data/index.json 和 data/content.json 文件存在且格式正确。
       </p>`;
  }
}

/* 树状分类配置 */
const TREE_CONFIG = [
  {
    name: '月季',
    children: [
      '丹陶', '吉洛', '奥斯汀', '戴尔巴德', '玫昂', '科尔德斯',
      '古老月季', '育种相关', '特性合集', '种植分享',
      '竞赛,评选以及月季园实测', '其他育种家'
    ]
  },
  { name: '多肉', children: [] }
];

/* 数据转换：扁平数组 → 树状分类结构 */
function transformData(rawData) {
  // 先按原始 cat 分组
  const flatGroups = {};
  rawData.forEach(item => {
    const catName = item.cat || '未分类';
    if (!flatGroups[catName]) flatGroups[catName] = [];
    flatGroups[catName].push({
      title: item.title,
      thumb: item.images && item.images.length > 0 ? item.images[0] : '',
      file_url: `./detail.html?id=${item.id}`
    });
  });

  // 构建树
  const tree = [];
  let totalItems = 0;

  TREE_CONFIG.forEach(group => {
    const node = { name: group.name, children: [], itemCount: 0 };
    group.children.forEach(childName => {
      const items = flatGroups[childName] || [];
      if (items.length > 0 || true) { // 保留空分类（如古老月季、特性合集）
        node.children.push({ name: childName, items: items, isLeaf: true });
        node.itemCount += items.length;
        totalItems += items.length;
      }
    });

    // 如果多肉等组没有在 children 里列出，从 flatGroups 中直接取
    if (group.children.length === 0 && flatGroups[group.name]) {
      const items = flatGroups[group.name];
      node.children.push({ name: group.name, items: items, isLeaf: true });
      node.itemCount = items.length;
      totalItems += items.length;
    }

    tree.push(node);
  });

  return { tree, flatGroups, totalItems };
}

/* 初始化 */
function init() {
  document.getElementById('loading').classList.add('hidden');
  renderSidebar();
  renderMobileNav();
  renderGrid(-1);
  bindEvents();
}

/* 渲染桌面端左侧树状分类 */
function renderSidebar() {
  const container = document.getElementById('cat-list');
  let html = `<div class="cat-item active" data-idx="-1">
    <span class="label">全部植物</span>
    <span class="count">${allData.totalItems}</span>
  </div>`;

  allData.tree.forEach((group, gIdx) => {
    // 父节点（月季 / 多肉）
    const groupId = `group-${gIdx}`;
    html += `<div class="tree-group" data-group="${groupId}">
      <div class="cat-item parent-item expanded" data-idx="${groupId}">
        <span class="tree-arrow">▼</span>
        <span class="label">${escapeHtml(group.name)}</span>
        <span class="count">${group.itemCount}</span>
      </div>
      <div class="tree-children">`;

    group.children.forEach((child, cIdx) => {
      const leafId = `${groupId}-${cIdx}`;
      html += `<div class="cat-item leaf-item" data-idx="${leafId}">
        <span class="tree-indent"></span>
        <span class="label">${escapeHtml(child.name)}</span>
        <span class="count">${child.items.length}</span>
      </div>`;
    });

    html += `</div></div>`;
  });

  container.innerHTML = html;
}

/* 渲染移动端横向分类条（扁平展示，带分组前缀） */
function renderMobileNav() {
  const scrollContainer = document.getElementById('mobile-cat-scroll');

  // 全部
  const allChip = document.createElement('div');
  allChip.className = 'cat-chip active';
  allChip.dataset.idx = '-1';
  allChip.textContent = `全部 (${allData.totalItems})`;
  scrollContainer.appendChild(allChip);

  // 各叶子分类
  allData.tree.forEach(group => {
    group.children.forEach((child, cIdx) => {
      const chip = document.createElement('div');
      chip.className = 'cat-chip';
      chip.dataset.idx = `group-${allData.tree.indexOf(group)}-${cIdx}`;
      chip.textContent = `${child.name} (${child.items.length})`;
      scrollContainer.appendChild(chip);
    });
  });
}

/* 根据树节点索引获取要展示的条目 */
function getItemsByIndex(catIdx) {
  if (catIdx === -1) {
    // 全部：合并所有叶子
    let result = [];
    allData.tree.forEach(g => g.children.forEach(c => result.push(...c.items)));
    return result;
  }
  // 父组节点（如 group-0 = 月季）
  if (/^group-(\d+)$/.test(catIdx)) {
    const gIdx = parseInt(catIdx.match(/^group-(\d+)$/)[1]);
    const group = allData.tree[gIdx];
    if (group) { let result = []; group.children.forEach(c => result.push(...c.items)); return result; }
  }
  // 叶子节点（如 group-0-0 = 丹陶）
  const leafMatch = catIdx.match(/^group-(\d+)-(\d+)$/);
  if (leafMatch) {
    const gIdx = parseInt(leafMatch[1]);
    const cIdx = parseInt(leafMatch[2]);
    const group = allData.tree[gIdx];
    if (group && group.children[cIdx]) return group.children[cIdx].items;
  }
  return [];
}

/* 渲染右侧卡片网格 */
function renderGrid(catIdx, keyword = '') {
  const grid = document.getElementById('grid');
  let items = getItemsByIndex(catIdx);
  if (keyword) {
    const kw = keyword.toLowerCase();
    items = items.filter(it => it.title.toLowerCase().includes(kw));
  }

  // 更新标题
  let titleText = '全部植物';
  if (/^group-(\d+)-(\d+)$/.test(catIdx)) {
    const m = catIdx.match(/^group-(\d+)-(\d+)$/);
    titleText = allData.tree[parseInt(m[1])].children[parseInt(m[2])].name;
  } else if (/^group-(\d+)$/.test(catIdx)) {
    titleText = allData.tree[parseInt(catIdx.match(/^group-(\d+)$/)[1])].name;
  }
  document.getElementById('section-title').textContent = titleText;
  document.getElementById('total-count').textContent = `${items.length} 个`;

  if (!items.length) {
    grid.innerHTML = '<div class="empty">暂无匹配结果</div>';
    return;
  }
  grid.innerHTML = items.map(it => {
    const safeTitle = escapeHtml(it.title);
    const safeUrl = escapeHtml(it.file_url || '');
    const thumbHtml = it.thumb
      ? `<img class="thumb" src="${escapeHtml(it.thumb)}" alt="${safeTitle} 缩略图" loading="lazy"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
         <div class="no-thumb" style="display:none;">无图</div>`
      : `<div class="no-thumb">无图</div>`;
    return `<div class="card" data-url="${safeUrl}" data-title="${safeTitle}" role="button" tabindex="0" aria-label="查看详情：${safeTitle}">
      ${thumbHtml}
      <div class="card-title">${safeTitle}</div>
    </div>`;
  }).join('');
}

/* 设置激活分类 */
function setActiveCategory(idx) {
  activeCatIdx = idx;
  // 桌面端 sidebar
  document.querySelectorAll('#cat-list .cat-item').forEach(el => {
    el.classList.toggle('active', el.dataset.idx === idx);
  });
  // 移动端 chips
  document.querySelectorAll('#mobile-cat-scroll .cat-chip').forEach(el => {
    el.classList.toggle('active', el.dataset.idx === idx);
  });
  // 移动端滚动到激活项
  const activeChip = document.querySelector('#mobile-cat-scroll .cat-chip.active');
  if (activeChip) {
    activeChip.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }
}

/* 搜索防抖公共函数 */
function debounceSearch(inputId, scrollTarget) {
  let timer;
  const el = document.getElementById(inputId);
  if (!el) return;
  el.addEventListener('input', e => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      renderGrid(activeCatIdx, e.target.value.trim());
      if (scrollTarget === 'content') {
        document.getElementById('content').scrollTo(0, 0);
      } else {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }, 250);
  });
}

/* 绑定事件 */
function bindEvents() {
  // 桌面端分类点击
  document.getElementById('cat-list').addEventListener('click', e => {
    const item = e.target.closest('.cat-item');
    if (!item) return;

    // 父节点：折叠/展开切换
    if (item.classList.contains('parent-item')) {
      item.classList.toggle('expanded');
      const groupEl = item.closest('.tree-group');
      if (groupEl) {
        const children = groupEl.querySelector('.tree-children');
        if (children) {
          const isOpen = item.classList.contains('expanded');
          children.style.display = isOpen ? '' : 'none';
          item.querySelector('.tree-arrow').textContent = isOpen ? '▼' : '▶';
        }
      }
      // 点击父节点也显示该组全部内容
      setActiveCategory(item.dataset.idx);
      renderGrid(item.dataset.idx, document.getElementById('search-input').value.trim());
      document.getElementById('content').scrollTo(0, 0);
      return;
    }

    const idx = item.dataset.idx;
    setActiveCategory(idx);
    renderGrid(idx, document.getElementById('search-input').value.trim());
    document.getElementById('content').scrollTo(0, 0);
  });

  // 移动端分类点击
  document.getElementById('mobile-cat-scroll').addEventListener('click', e => {
    const chip = e.target.closest('.cat-chip');
    if (!chip) return;
    const idx = chip.dataset.idx;
    setActiveCategory(idx);
    const keyword = document.getElementById('mobile-search-input').value.trim();
    renderGrid(idx, keyword);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // 搜索（桌面端 + 移动端共用防抖逻辑）
  debounceSearch('search-input', 'content');
  debounceSearch('mobile-search-input', 'window');

  // 卡片点击 → 弹窗
  document.getElementById('grid').addEventListener('click', e => {
    const card = e.target.closest('.card');
    if (!card) return;
    openModal(card.dataset.url, card.dataset.title);
  });

  // 关闭弹窗
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      closeModal();
      document.getElementById('lightbox').classList.remove('active');
    }
  });
}

/* 打开弹窗 — 内联渲染详情 */
function openModal(url, title) {
  const id = url.replace('./detail.html?id=', '');
  document.getElementById('modal-title').textContent = title;

  const detailEl = document.getElementById('detail-view');

  try {
    const content = contentData[id];

    if (content && Array.isArray(content.segments)) {
      let html = `<h2 class="detail-title">${escapeHtml(title)}</h2><div class="detail-body">`;
      content.segments.forEach(seg => {
        if (seg.t) {
          // 文本段
          html += `<p>${escapeHtml(seg.t)}</p>`;
        } else if (seg.i) {
          // 图片段
          html += `<img src="${escapeHtml(seg.i)}" alt="图片" loading="lazy">`;
        }
      });
      html += '</div>';
      detailEl.innerHTML = html;
      // 绑定图片点击灯箱事件（替代内联 onclick）
      detailEl.querySelectorAll('.detail-body img').forEach(img => {
        img.addEventListener('click', () => showLightbox(img.src));
        img.style.cursor = 'pointer';
      });
    } else {
      detailEl.innerHTML = `
        <div class="detail-error">
          <p>暂无详情内容</p>
          <p style="font-size:12px;color:#bbb;margin-top:8px;">ID: ${escapeHtml(id)}</p>
        </div>`;
    }
  } catch (err) {
    console.error('[openModal] 渲染详情失败:', err);
    detailEl.innerHTML = `
      <div class="detail-error">
        <p>内容渲染出错</p>
        <p style="font-size:12px;color:#bbb;margin-top:8px;">请稍后重试</p>
      </div>`;
  }

  detailEl.classList.add('active');
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

/* 关闭弹窗 */
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  const detailEl = document.getElementById('detail-view');
  detailEl.classList.remove('active');
  // 延迟清空内容，让关闭动画更平滑
  setTimeout(() => { detailEl.innerHTML = ''; }, 300);
  document.body.style.overflow = '';
}

/* 图片灯箱 */
function showLightbox(src) {
  const lb = document.getElementById('lightbox');
  lb.innerHTML = `<img src="${src}" alt="预览">`;
  lb.classList.add('active');
}
document.addEventListener('DOMContentLoaded', () => {
  const lb = document.getElementById('lightbox');
  lb.addEventListener('click', () => lb.classList.remove('active'));
});

/* HTML 转义 */
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* 启动 */
loadData();

/* 关闭 IIFE，避免全局变量污染 */
})();
</script>
