<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>园艺图鉴 · 内容编辑器</title>
<style>
:root {
  --bg: #f5f5f0;
  --surface: #fff;
  --text: #1a1a1a;
  --text-muted: #888;
  --border: #ddd;
  --accent: #6a9bcc;
  --accent-soft: #e8f0f8;
  --danger: #e74c3c;
  --danger-soft: #fde8e8;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a1a;
    --surface: #2a2a2a;
    --text: #e0e0e0;
    --text-muted: #999;
    --border: #444;
    --accent: #7ab8e8;
    --accent-soft: #1e2a35;
    --danger: #ff6b6b;
    --danger-soft: #3a1a1a;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 20px;
  min-height: 100vh;
}
h1 { font-size: 22px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
h1 small { font-size: 13px; color: var(--text-muted); font-weight: normal; }

.layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1400px; margin: 0 auto; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

/* Editor panel */
.editor { background: var(--surface); border-radius: var(--radius); padding: 20px; }
.editor h2 { font-size: 15px; margin-bottom: 12px; color: var(--text-muted); }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
@media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }

label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 3px; }
input, textarea, select {
  width: 100%; padding: 8px 10px; border: 1px solid var(--border);
  border-radius: 6px; font-size: 14px; background: var(--surface);
  color: var(--text); transition: border-color .15s;
}
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
textarea { resize: vertical; min-height: 60px; font-family: inherit; }

/* Segments */
.segments { margin-top: 16px; }
.segment-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; min-height: 40px; }
.segment-card {
  display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px;
  background: var(--bg); border-radius: 8px; border: 1px solid var(--border);
  cursor: move; transition: box-shadow .15s;
}
.segment-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.segment-card.dragging { opacity: .5; }
.segment-card.drag-over { border-color: var(--accent); }

.seg-order { font-size: 12px; color: var(--text-muted); min-width: 20px; padding-top: 8px; text-align: center; user-select: none; }
.seg-body { flex: 1; min-width: 0; }
.seg-type-badge {
  display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px;
  margin-bottom: 4px; font-weight: 500;
}
.seg-type-badge.text { background: var(--accent-soft); color: var(--accent); }
.seg-type-badge.image { background: #e8f8e8; color: #27ae60; }
.seg-type-badge.video { background: #fef3e2; color: #e67e22; }

.seg-text { font-size: 13px; line-height: 1.5; word-break: break-word; }
.seg-url { font-size: 12px; color: var(--accent); word-break: break-all; }
.seg-actions { display: flex; gap: 4px; flex-shrink: 0; padding-top: 4px; }

.btn {
  display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px;
  border: 1px solid var(--border); border-radius: 6px; font-size: 13px;
  background: var(--surface); color: var(--text); cursor: pointer;
  transition: all .15s; user-select: none;
}
.btn:hover { background: var(--accent-soft); border-color: var(--accent); }
.btn-danger { color: var(--danger); }
.btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { opacity: .85; }
.btn-sm { padding: 4px 8px; font-size: 12px; }

.add-bar { display: flex; gap: 6px; flex-wrap: wrap; }
.add-bar .btn { flex: 1; justify-content: center; min-width: 80px; }

.actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.actions .btn { flex: 1; justify-content: center; }

/* Preview */
.preview {
  background: var(--surface); border-radius: var(--radius); padding: 20px;
  position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow-y: auto;
}
@media (max-width: 900px) { .preview { position: static; max-height: none; } }
.preview h2 { font-size: 15px; color: var(--text-muted); margin-bottom: 12px; }

.mockup {
  max-width: 420px; margin: 0 auto; border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden; background: var(--bg);
}
.mockup-header { padding: 16px 16px 8px; }
.mockup-title { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
.mockup-meta { font-size: 12px; color: var(--text-muted); display: flex; gap: 8px; flex-wrap: wrap; }
.mockup-body { padding: 8px 16px 16px; }
.mockup-body p { font-size: 14px; line-height: 1.7; margin-bottom: 10px; }
.mockup-body img { width: 100%; border-radius: 8px; margin-bottom: 10px; display: block; }
.mockup-video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #999; position: relative; overflow: hidden; }
.mockup-video iframe { width: 100%; height: 100%; border: none; }
.mockup-video .badge { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,.7); color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
.mockup-empty { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px; }

/* Toast */
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--text); color: var(--bg); padding: 10px 20px; border-radius: 8px;
  font-size: 14px; opacity: 0; transition: all .3s; pointer-events: none; z-index: 999;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Import overlay */
.import-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
  z-index: 100; align-items: center; justify-content: center;
}
.import-overlay.active { display: flex; }
.import-box {
  background: var(--surface); border-radius: 12px; padding: 24px;
  width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto;
}
.import-box h3 { margin-bottom: 10px; }
.import-box textarea { min-height: 200px; font-family: 'Courier New', monospace; font-size: 13px; }
.import-actions { display: flex; gap: 8px; margin-top: 10px; }
</style>
</head>
<body>

<h1>📝 园艺图鉴 · 内容编辑器 <small>拖拽排序 · 实时预览</small></h1>

<div class="layout">

<!-- 编辑面板 -->
<div class="editor">
  <h2>基本信息</h2>
  <div class="form-row">
    <div><label>ID *</label><input id="f-id" placeholder="rose_0001" value=""></div>
    <div><label>标题 *</label><input id="f-title" placeholder="品种名称 / 文章标题" value=""></div>
  </div>
  <div class="form-row">
    <div><label>分类</label>
      <select id="f-type">
        <option value="月季">月季</option>
        <option value="微博">微博</option>
        <option value="小红书">小红书</option>
        <option value="知识图谱">知识图谱</option>
        <option value="种植分享">种植分享</option>
        <option value="育种相关">育种相关</option>
        <option value="特性合集">特性合集</option>
        <option value="其他">其他</option>
      </select>
    </div>
    <div><label>标签</label><input id="f-tag" placeholder="如: 戴尔巴德" value=""></div>
  </div>
  <div class="form-row">
    <div><label>作者</label><input id="f-author" placeholder="作者名称" value=""></div>
    <div><label>时间</label><input id="f-time" placeholder="2024-01-01" value=""></div>
  </div>
  <div><label>原文链接</label><input id="f-weibo" placeholder="https://weibo.com/xxx" value=""></div>

  <div class="segments">
    <h2>内容段落 <small style="color:var(--text-muted);font-weight:normal;">（拖拽调整顺序）</small></h2>
    <div class="segment-list" id="seg-list"></div>

    <div class="add-bar">
      <button class="btn" onclick="addSegment('text')">+ 文字</button>
      <button class="btn" onclick="addSegment('image')">+ 图片</button>
      <button class="btn" onclick="addSegment('video')">+ 视频</button>
    </div>
  </div>

  <div class="actions">
    <button class="btn" onclick="importJson()">📂 导入 JSON</button>
    <button class="btn" onclick="clearAll()">🗑️ 清空</button>
    <button class="btn btn-primary" onclick="exportJson()">📋 复制 JSON</button>
    <button class="btn btn-primary" onclick="downloadJson()">💾 下载 .json</button>
  </div>
</div>

<!-- 预览面板 -->
<div class="preview">
  <h2>👁️ 预览</h2>
  <div class="mockup" id="mockup">
    <div class="mockup-empty">编辑内容后将在此显示预览</div>
  </div>
</div>

</div>

<!-- 导入弹窗 -->
<div class="import-overlay" id="import-overlay">
  <div class="import-box">
    <h3>导入 JSON</h3>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:8px;">粘贴已有的 content JSON：</p>
    <textarea id="import-area" placeholder='{"title":"...","segments":[...]}'></textarea>
    <div class="import-actions">
      <button class="btn" onclick="document.getElementById('import-overlay').classList.remove('active')">取消</button>
      <button class="btn btn-primary" onclick="doImport()">导入</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== 状态 ===== */
let segments = [];
let dragSrcIdx = -1;

/* ===== DOM ===== */
const segList = document.getElementById('seg-list');
const mockup = document.getElementById('mockup');

/* ===== 添加段落 ===== */
function addSegment(type, value = '') {
  segments.push({ type, value });
  renderSegments();
  renderPreview();
}

/* ===== 编辑段落 ===== */
function updateSegment(idx, value) {
  segments[idx].value = value;
  renderSegments();
  renderPreview();
}

function removeSegment(idx) {
  segments.splice(idx, 1);
  renderSegments();
  renderPreview();
}

/* ===== 渲染段落列表 ===== */
function renderSegments() {
  if (!segments.length) {
    segList.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px;border:2px dashed var(--border);border-radius:8px;">暂无内容段落，点击上方按钮添加</div>';
    return;
  }
  segList.innerHTML = segments.map((seg, idx) => {
    let inputHtml = '';
    const badgeClass = { text: 'text', image: 'image', video: 'video' }[seg.type] || '';
    const typeLabel = { text: '文字', image: '图片', video: '视频' }[seg.type] || seg.type;

    if (seg.type === 'text') {
      inputHtml = `<textarea class="seg-text" rows="3"
        oninput="updateSegment(${idx}, this.value)"
        placeholder="输入文字内容…">${escapeHtml(seg.value)}</textarea>`;
    } else {
      inputHtml = `<input class="seg-url" value="${escapeHtml(seg.value)}"
        oninput="updateSegment(${idx}, this.value)"
        placeholder="${seg.type === 'image' ? '图片 URL…' : 'YouTube/Bilibili 视频 URL…'}">`;
    }

    return `<div class="segment-card" draggable="true" data-idx="${idx}"
      ondragstart="onDragStart(event)" ondragover="onDragOver(event)" ondrop="onDrop(event)" ondragend="onDragEnd(event)">
      <div class="seg-order">${idx + 1}</div>
      <div class="seg-body">
        <span class="seg-type-badge ${badgeClass}">${typeLabel}</span>
        ${inputHtml}
      </div>
      <div class="seg-actions">
        <button class="btn btn-sm btn-danger" onclick="removeSegment(${idx})" title="删除">✕</button>
      </div>
    </div>`;
  }).join('');
}

/* ===== 拖拽排序 ===== */
function onDragStart(e) {
  dragSrcIdx = parseInt(e.target.closest('.segment-card').dataset.idx);
  e.target.closest('.segment-card').classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const card = e.target.closest('.segment-card');
  if (card) card.classList.add('drag-over');
}
function onDrop(e) {
  e.preventDefault();
  const targetIdx = parseInt(e.target.closest('.segment-card').dataset.idx);
  if (dragSrcIdx !== -1 && dragSrcIdx !== targetIdx) {
    const [moved] = segments.splice(dragSrcIdx, 1);
    segments.splice(targetIdx, 0, moved);
    renderSegments();
    renderPreview();
  }
  document.querySelectorAll('.segment-card').forEach(c => c.classList.remove('dragging', 'drag-over'));
  dragSrcIdx = -1;
}
function onDragEnd(e) {
  document.querySelectorAll('.segment-card').forEach(c => c.classList.remove('dragging', 'drag-over'));
  dragSrcIdx = -1;
}

/* ===== 导出 ===== */
function buildEntry() {
  const id = document.getElementById('f-id').value.trim();
  const title = document.getElementById('f-title').value.trim();
  const type = document.getElementById('f-type').value;
  const tag = document.getElementById('f-tag').value.trim();
  const author = document.getElementById('f-author').value.trim();
  const time = document.getElementById('f-time').value.trim();
  const weiboUrl = document.getElementById('f-weibo').value.trim();

  const segs = segments.map(s => {
    if (s.type === 'text') return { t: s.value };
    if (s.type === 'image') return { i: s.value };
    if (s.type === 'video') return { v: s.value };
    return {};
  }).filter(s => {
    if (s.t) return s.t.trim();
    if (s.i) return s.i.trim();
    if (s.v) return s.v.trim();
    return false;
  });

  const entry = { title, type, segments: segs };
  if (tag) entry.tag = tag;
  if (author) entry.author = /^\{/.test(author) ? JSON.parse(author) : author;
  if (time) entry.time = time;
  if (weiboUrl) entry.weibo_url = weiboUrl;
  return entry;
}

function exportJson() {
  const entry = buildEntry();
  navigator.clipboard.writeText(JSON.stringify(entry, null, 2)).then(() => {
    showToast('✅ JSON 已复制到剪贴板');
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = JSON.stringify(entry, null, 2);
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('✅ JSON 已复制到剪贴板');
  });
}

function downloadJson() {
  const entry = buildEntry();
  const id = document.getElementById('f-id').value.trim() || 'untitled';
  const blob = new Blob([JSON.stringify(entry, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${id}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ 文件已下载');
}

/* ===== 导入 ===== */
function importJson() {
  document.getElementById('import-area').value = '';
  document.getElementById('import-overlay').classList.add('active');
}
function doImport() {
  const raw = document.getElementById('import-area').value.trim();
  if (!raw) return;
  try {
    const data = JSON.parse(raw);
    loadEntry(data);
    document.getElementById('import-overlay').classList.remove('active');
    showToast('✅ 导入成功');
  } catch (e) {
    showToast('❌ JSON 格式错误: ' + e.message);
  }
}

function loadEntry(data) {
  if (data.id) document.getElementById('f-id').value = data.id;
  document.getElementById('f-title').value = data.title || '';
  if (data.type) document.getElementById('f-type').value = data.type;
  document.getElementById('f-tag').value = data.tag || '';
  const authorVal = typeof data.author === 'object' ? (data.author.name || JSON.stringify(data.author)) : (data.author || '');
  document.getElementById('f-author').value = authorVal;
  document.getElementById('f-time').value = data.time || '';
  document.getElementById('f-weibo').value = data.weibo_url || '';
  segments = (data.segments || []).map(s => {
    if (s.t) return { type: 'text', value: s.t };
    if (s.i) return { type: 'image', value: s.i };
    if (s.v) return { type: 'video', value: s.v };
    return { type: 'text', value: '' };
  });
  renderSegments();
  renderPreview();
}

/* ===== 清空 ===== */
function clearAll() {
  if (!confirm('确定清空所有内容？')) return;
  document.querySelectorAll('.editor input, .editor textarea, .editor select').forEach(el => {
    if (el.tagName === 'SELECT') el.selectedIndex = 0;
    else el.value = '';
  });
  segments = [];
  renderSegments();
  renderPreview();
  showToast('已清空');
}

/* ===== 预览 ===== */
function renderPreview() {
  const title = document.getElementById('f-title').value.trim() || '标题';
  const tag = document.getElementById('f-tag').value.trim();
  const author = document.getElementById('f-author').value.trim();
  const segs = segments.filter(s => s.value && s.value.trim());

  if (!segs.length) {
    mockup.innerHTML = '<div class="mockup-empty">编辑内容后将在此显示预览</div>';
    return;
  }

  let bodyHtml = '';
  segs.forEach(seg => {
    if (seg.type === 'text') {
      seg.value.split('\n').filter(Boolean).forEach(p => {
        bodyHtml += `<p>${escapeHtml(p)}</p>`;
      });
    } else if (seg.type === 'image') {
      bodyHtml += `<img src="${escapeHtml(seg.value)}" alt="图片" loading="lazy">`;
    } else if (seg.type === 'video') {
      const iframeSrc = getEmbedUrl(seg.value);
      if (iframeSrc) {
        bodyHtml += `<div class="mockup-video"><iframe src="${escapeHtml(iframeSrc)}" allowfullscreen loading="lazy"></iframe></div>`;
      } else {
        bodyHtml += `<div class="mockup-video" style="background:var(--surface);color:var(--text-muted);">🔗 ${escapeHtml(seg.value)}</div>`;
      }
    }
  });

  mockup.innerHTML = `
    <div class="mockup-header">
      <div class="mockup-title">${escapeHtml(title)}</div>
      ${tag || author ? `<div class="mockup-meta">${tag ? '#' + escapeHtml(tag) : ''}${author ? ' 👤 ' + escapeHtml(author) : ''}</div>` : ''}
    </div>
    <div class="mockup-body">${bodyHtml}</div>`;
}

/* ===== 视频 URL 解析 ===== */
function getEmbedUrl(url) {
  if (!url) return null;
  try {
    const u = new URL(url);
    if (u.hostname.includes('youtube.com') || u.hostname === 'youtu.be') {
      let vid = u.searchParams.get('v');
      if (!vid) vid = u.pathname.slice(1).split('/')[0];
      if (vid) return `https://www.youtube.com/embed/${encodeURIComponent(vid)}`;
    }
    if (u.hostname.includes('bilibili.com') || u.hostname === 'b23.tv') {
      const bvMatch = u.pathname.match(/\/video\/(BV\w+)/i);
      if (bvMatch) return `https://player.bilibili.com/player.html?bvid=${bvMatch[1]}&autoplay=0`;
      const bvShort = u.pathname.match(/^\/(BV\w+)/i);
      if (bvShort) return `https://player.bilibili.com/player.html?bvid=${bvShort[1]}&autoplay=0`;
    }
  } catch {}
  return null;
}

/* ===== 工具 ===== */
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

/* ===== 键盘快捷键 ===== */
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    downloadJson();
  }
  if (e.key === 'Escape') {
    document.getElementById('import-overlay').classList.remove('active');
  }
});

/* ===== 自动预览 ===== */
['f-title', 'f-tag', 'f-author'].forEach(id => {
  document.getElementById(id).addEventListener('input', renderPreview);
});

/* ===== 启动时加载示例 ===== */
addSegment('text', '来看看这位 UP 主分享的月季养护技巧，非常实用！');
addSegment('video', 'https://www.youtube.com/watch?v=dQw4w9WgXcQ');
addSegment('image', 'https://img.feijibei.top/images/rose_0400.webp');
addSegment('text', '修剪后注意施肥，推荐使用缓释肥，效果更好。');

console.log('📝 园艺图鉴内容编辑器已启动');
console.log('快捷键: Ctrl+S 保存文件, Escape 关闭弹窗');
</script>
</body>
</html>
