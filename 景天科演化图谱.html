      #toolbar {
        position: fixed;

        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      #toolbar button {
        padding: 6px 14px;

        background: rgba(30, 41, 59, 0.9);

        color: #cbd5e1;
        cursor: pointer;
        font-size: 13px;
        transition: all 0.2s;
      }
      #toolbar button:hover {
        background: rgba(51, 65, 85, 0.9);
        color: #f1f5f9;
        border-color: rgba(255, 255, 255, 0.3);
      }
      #toolbar button.active {
        background: #3b82f6;
        color: #fff;
        border-color: #3b82f6;
      }
      #legend {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 100;
        background: rgba(30, 41, 59, 0.9);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 12px;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 3px 0;
      }
      .legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      #tooltip {
        position: fixed;
        z-index: 200;
        pointer-events: none;
        background: rgba(15, 23, 42, 0.95);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        padding: 12px 16px;
        max-width: 400px;
        opacity: 0;
        transition: opacity 0.15s;
        font-size: 13px;
        line-height: 1.6;
      }
      #tooltip img {
        max-width: 300px;
        max-height: 200px;
        border-radius: 6px;
        margin-top: 6px;
        display: block;
      }
      #tooltip .tt-name {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      #tooltip .tt-meta {
        color: #94a3b8;
        font-size: 11px;
      }
      #detail-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 90;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      #detail-backdrop.active {
        opacity: 1;
        pointer-events: auto;
      }
      #loading-overlay {
        position: fixed;
        inset: 0;
        background: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999;
        transition: opacity 0.4s;
      }
      .loader {
        font-size: 18px;
        color: #94a3b8;
      }
      svg {
        width: 100vw;
        height: 100vh;
      }

      /* Link styles */
      .link {
        fill: none;
        stroke: rgba(148, 163, 184, 0.2);
        stroke-width: 1.2px;
      }

      /* Node hover effects */
      .clade-node:hover circle,
      .genus-node:hover circle {
        stroke: #f8fafc;
        stroke-width: 3px;
      }
      .species-node:hover .sp-card-bg {
        stroke: #f8fafc;
        stroke-width: 2px;
      }

      /* Node text */
      .node .genus-text {
        font-size: 12px;
        font-weight: 600;
      }
      .node .clade-text {
        font-size: 13px;
        font-weight: 700;
      }
      .node .root-text {
        font-size: 14px;
        font-weight: 800;
        fill: #f8fafc;
      }
      .node .count-text {
        font-size: 10px;
        fill: #64748b;
      }
      .node .expand-ind {
        pointer-events: none;
      }

      /* Species card */
      .sp-card-bg {
        fill: rgba(15, 23, 42, 0.85);
        rx: 6;
        ry: 6;
      }
      .sp-card-img {
        clip-path: inset(0 round 4px 4px 0 0);
      }
      .sp-card-name {
        font-size: 10px;
        fill: #cbd5e1;
        text-anchor: middle;
      }
      .sp-card-noimg {
        fill: rgba(30, 41, 59, 0.9);
        rx: 4;
        ry: 4;
      }
      .sp-card-noimg-text {
        font-size: 9px;
        fill: #64748b;
        text-anchor: middle;
      }

      /* Detail panel */

        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(30, 41, 59, 0.95);

        border-top: 1px solid rgba(255, 255, 255, 0.15);
        padding: 16px 24px;
        z-index: 150;
        transform: translateY(100%);
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        max-height: 42vh;
        overflow-y: auto;
      }

        transform: translateY(0);
      }

        font-size: 16px;
        margin-bottom: 6px;
      }

        color: #94a3b8;

        padding: 6px;

      }

      }

      }

        text-align: center;

        top: 8px;
        right: 16px;
        background: none;
        border: none;
        color: #64748b;
        font-size: 20px;
        cursor: pointer;

        color: #f8fafc;

      };

      // ===== D3 SETUP =====
      const W = window.innerWidth;
      const H = window.innerHeight;
      const margin = { top: 80, right: 280, bottom: 80, left: 160 };

      const svg = d3
        .select('#tree')
        .attr('viewBox', [0, 0, W, H])
        .call(
          d3
            .zoom()
            .scaleExtent([0.1, 4])
            .on('zoom', (event) => {
              g.attr('transform', event.transform);
            })
        );

      const g = svg.append('g');

      // Species card dimensions
      const CARD_W = 105;
      const CARD_H = 82;
      const IMG_W = CARD_W - 6;
      const IMG_H = 54;
      const CARD_GAP = 6; // pixels between species cards

      // ===== HELPER FUNCTIONS =====
      function countVisibleLeaves(node) {
        if ((!node.children || !node.children.length) && (!node._children || !node._children.length))
          return 1;
        if (node.children && node.children.length)
          return node.children.reduce((sum, c) => sum + countVisibleLeaves(c), 0);
        if (node._children) return 1;
        return 1;
      }

      function findCladeAncestor(d) {
        while (d) {
          if (d.data.type === 'clade' || d.data.type === 'root') return d;
          d = d.parent;
        }
        return null;
      }

      function findVisibleParent(d) {
        let p = d.parent;
        while (p) {
          if (p.x !== undefined && p.y !== undefined) return p;
          p = p.parent;
        }
        return null;
      }

      function truncate(str, len) {
        return str.length > len ? str.substring(0, len) + '…' : str;
      }

      function cleanName(name) {
        // Remove leading genus prefix like "Pachyphytum " and extract meaningful part
        const parts = name.split(' ');
        if (parts.length >= 3) return parts.slice(2).join(' ');
        if (parts.length === 2) return parts[1];
        return name;
      }

      // ===== DIAGONAL =====
      function diagonal(d) {
        // For species-to-parent, draw straight line from card edge
        if (d.target.data && d.target.data.type === 'species') {
          const sx = d.source.y;
          const sy = d.source.x;
          const tx = d.target.y - CARD_W / 2;
          const ty = d.target.x;
          return `M${sx},${sy}
            C${(sx + tx) / 2},${sy}
             ${(sx + tx) / 2},${ty}
             ${tx},${ty}`;
        }
        return `M${d.source.y},${d.source.x}
          C${(d.source.y + d.target.y) / 2},${d.source.x}
           ${(d.source.y + d.target.y) / 2},${d.target.x}
           ${d.target.y},${d.target.x}`;
      }

      // ===== TREE LAYOUT =====
      const treeLayout = d3
        .tree()
        .nodeSize([CARD_H + CARD_GAP, 200])
        .separation((a, b) => {
          if (a.parent === b.parent) {
            if (a.data.type === 'species') return 1.1;
            return 1.4;
          }
          return 1.8;
        });

      const root = d3.hierarchy(TREE_DATA);
      root.descendants().forEach((d) => {
        d._depth = d.depth;
      });

      // ===== INITIAL STATE: only Outgroup expanded =====
      // Collapse ALL species first
      root.descendants().forEach((d) => {
        if (d.depth >= 3 && d.children) {
          d._children = d.children;
          d.children = null;
        }
      });
      // Also collapse non-Outgroup genera
      root.descendants().forEach((d) => {
        if (d.depth >= 2 && d.children && d.data.type === 'genus') {
          // Keep Outgroup genera expanded, collapse others
          if (findCladeAncestor(d) && findCladeAncestor(d).data.shortName !== 'Outgroup') {
            d._children = d.children;
            d.children = null;
          }
        }
      });

      // ===== RENDER =====
      function update(source) {
        treeLayout(root);

        const nodes = root.descendants();
        const links = root.links();

        // --- LINKS ---
        const link = g.selectAll('.link').data(links, (d) => d.target.data.shortName + '_' + d.target.depth);
        link.exit().transition().duration(300).attr('stroke-opacity', 0).remove();

        const linkEnter = link
          .enter()
          .append('path')
          .attr('class', 'link')
          .attr('d', (d) => {
            const o = { x: source.x0 || 0, y: source.y0 || 0 };
            return diagonal({ source: o, target: o });
          })
          .attr('stroke-opacity', 0);

        link
          .merge(linkEnter)
          .transition()
          .duration(500)
          .attr('d', diagonal)
          .attr('stroke-opacity', 1)
          .attr('stroke', (d) => {
            const anc = findCladeAncestor(d.target);
            return anc ? anc.data.color + '44' : 'rgba(148,163,184,0.18)';
          });

        // --- NODES ---
        const node = g
          .selectAll('.node')
          .data(
            nodes,
            (d) => d.data.shortName + '_' + d.depth + '_' + (d.parent ? d.parent.data.shortName : '')
          );

        node.exit().transition().duration(300).style('opacity', 0).remove();

        const nodeEnter = node
          .enter()
          .append('g')
          .attr('class', (d) => `node ${d.data.type}-node`)
          .attr('transform', (d) => {
            const p = findVisibleParent(d);
            return `translate(${p ? p.y : source ? source.y0 : 0},${p ? p.x : source ? source.x0 : 0})`;
          })
          .style('opacity', 0)
          .on('click', (event, d) => {
            event.stopPropagation();
            clickNode(d);
          })
          .on('mouseenter', (event, d) => showTooltip(event, d))
          .on('mouseleave', hideTooltip);

        // Build node visuals
        nodeEnter.each(function (d) {
          const g = d3.select(this);
          const color = d.data.color || '#64748b';
          const hasHidden = d._children && d._children.length > 0;
          const isExpanded = d.children && d.children.length > 0;

          if (d.data.type === 'root') {
            g.append('circle')
              .attr('r', 18)
              .attr('fill', '#1e293b')
              .attr('stroke', '#94a3b8')
              .attr('stroke-width', 3);
            g.append('text')
              .attr('class', 'root-text')
              .attr('dy', 4)
              .attr('text-anchor', 'middle')
              .attr('fill', '#f8fafc')
              .text('景天科');
          } else if (d.data.type === 'clade') {
            const r = 15;
            g.append('circle')
              .attr('r', r)
              .attr('fill', color + '22')
              .attr('stroke', color)
              .attr('stroke-width', 2.5);
            if (hasHidden) {
              g.append('text')
                .attr('class', 'expand-ind')
                .attr('dy', 5)
                .attr('text-anchor', 'middle')
                .attr('font-size', '14px')
                .attr('fill', color)
                .attr('font-weight', 'bold')
                .text('+');
            } else if (isExpanded) {
              g.append('text')
                .attr('class', 'expand-ind')
                .attr('dy', 5)
                .attr('text-anchor', 'middle')
                .attr('font-size', '12px')
                .attr('fill', color)
                .text('\u2212');
            }
            const label = d.data.shortName.replace('Clade', 'C');
            g.append('text')
              .attr('dy', -r - 4)
              .attr('text-anchor', 'middle')
              .attr('class', 'clade-text')
              .attr('fill', color)
              .text(label);
            g.append('text')
              .attr('dy', r + 14)
              .attr('text-anchor', 'middle')
              .attr('class', 'count-text')
              .text(`${d.data.speciesCount || 0}种`);
          } else if (d.data.type === 'genus') {
            const r = 11;
            g.append('circle')
              .attr('r', r)
              .attr('fill', color + '33')
              .attr('stroke', color)
              .attr('stroke-width', 2);
            if (hasHidden) {
              g.append('text')
                .attr('class', 'expand-ind')
                .attr('dy', 5)
                .attr('text-anchor', 'middle')
                .attr('font-size', '12px')
                .attr('fill', color)
                .attr('font-weight', 'bold')
                .text('+');
            } else if (isExpanded) {
              g.append('text')
                .attr('class', 'expand-ind')
                .attr('dy', 5)
                .attr('text-anchor', 'middle')
                .attr('font-size', '11px')
                .attr('fill', color)
                .text('\u2212');
            }
            g.append('text')
              .attr('dy', -r - 4)
              .attr('text-anchor', 'middle')
              .attr('class', 'genus-text')
              .attr('fill', '#e2e8f0')
              .text(d.data.shortName);
            const cnt = d.data.speciesCount || 0;
            g.append('text')
              .attr('dy', r + 13)
              .attr('text-anchor', 'middle')
              .attr('class', 'count-text')
              .text(`${cnt}种`);
          } else if (d.data.type === 'species') {
            // --- SPECIES IMAGE CARD ---
            const hasImg = d.data.thumbnail && d.data.images && d.data.images.length > 0;
            // Card background
            g.append('rect')
              .attr('class', 'sp-card-bg')
              .attr('x', -CARD_W / 2)
              .attr('y', -CARD_H / 2)
              .attr('width', CARD_W)
              .attr('height', CARD_H)
              .attr('stroke', color + '55')
              .attr('stroke-width', 1.5)
              .attr('fill', 'rgba(15,23,42,0.9)');

            if (hasImg) {
              // Image
              g.append('image')
                .attr('x', -IMG_W / 2)
                .attr('y', -CARD_H / 2 + 3)
                .attr('width', IMG_W)
                .attr('height', IMG_H)
                .attr('href', d.data.thumbnail)
                .attr('preserveAspectRatio', 'xMidYMid slice')
                .attr('class', 'sp-card-img')
                .attr('clip-path', 'url(#cardClip)');
            } else {
              // No image placeholder
              g.append('rect')
                .attr('x', -IMG_W / 2)
                .attr('y', -CARD_H / 2 + 3)
                .attr('width', IMG_W)
                .attr('height', IMG_H)
                .attr('fill', 'rgba(30,41,59,0.8)')
                .attr('class', 'sp-card-noimg');
              g.append('text')
                .attr('x', 0)
                .attr('y', -CARD_H / 2 + IMG_H / 2 + 4)
                .attr('text-anchor', 'middle')
                .attr('class', 'sp-card-noimg-text')
                .text('暂无图片');
            }
            // Species name
            const dName = cleanName(d.data.name);
            g.append('text')
              .attr('x', 0)
              .attr('y', CARD_H / 2 - 8)
              .attr('text-anchor', 'middle')
              .attr('class', 'sp-card-name')
              .text(truncate(dName, 14));
          }
        });

        // Merge + transition
        node
          .merge(nodeEnter)
          .transition()
          .duration(500)
          .attr('transform', (d) => {
            // Species nodes offset slightly for card
            if (d.data.type === 'species') return `translate(${d.y + CARD_W / 2 + 8},${d.x})`;
            return `translate(${d.y},${d.x})`;
          })
          .style('opacity', 1)
          .on('end', function () {
            const g = d3.select(this);
            const d = g.datum();
            const hasHidden = d._children && d._children.length > 0;
            const isExpanded = d.children && d.children.length > 0;
            g.select('.expand-ind').remove();
            if (hasHidden && (d.data.type === 'clade' || d.data.type === 'genus')) {
              const fs = d.data.type === 'clade' ? '14px' : '12px';
              g.insert('text', ':first-child')
                .attr('class', 'expand-ind')
                .attr('dy', 5)
                .attr('text-anchor', 'middle')
                .attr('font-size', fs)
                .attr('fill', d.data.color)
                .attr('font-weight', 'bold')
                .text('+');
            } else if (isExpanded && (d.data.type === 'clade' || d.data.type === 'genus')) {
              const fs = d.data.type === 'clade' ? '12px' : '11px';
              g.insert('text', ':first-child')
                .attr('class', 'expand-ind')
                .attr('dy', 5)
                .attr('text-anchor', 'middle')
                .attr('font-size', fs)
                .attr('fill', d.data.color)
                .text('\u2212');
            }
          });

        // Store positions
        root.descendants().forEach((d) => {
          d.x0 = d.x;
          d.y0 = d.y;
        });
      }

      // ===== CLICK =====
      function clickNode(d) {
        if (d.data.type === 'species') {
          showDetailPanel(d);
          return;
        }
        if (d.children) {
          d._children = d.children;
          d.children = null;
        } else if (d._children) {
          d.children = d._children;
          d._children = null;
        }
        update(d);
      }

      // ===== TOOLTIP =====
      function showTooltip(event, d) {
        const tip = document.getElementById('tooltip');
        let html = '';

        if (d.data.type === 'root') {
          html = `<div class="tt-name">${d.data.name.replace('\n', ' ')}</div>
            <div class="tt-meta">景天科 Crassulaceae</div>`;
        } else if (d.data.type === 'clade') {
          html = `<div class="tt-name">${d.data.name}</div>
            <div class="tt-meta">${d.data.speciesCount}个物种</div>
            <div style="margin-top:6px;font-size:12px;color:#cbd5e1">${d.data.desc || ''}</div>`;
        } else if (d.data.type === 'genus') {
          html = `<div class="tt-name">${d.data.name}</div>
            <div class="tt-meta">${d.data.speciesCount}个物种</div>`;
        } else if (d.data.type === 'species') {
          html = `<div class="tt-name">${d.data.name}</div>
            <div class="tt-meta">${d.parent ? d.parent.data.name : ''}</div>`;
          if (d.data.thumbnail && d.data.images && d.data.images.length > 0) {
            html += `<img src="${d.data.thumbnail}" alt="">`;
          } else {
            html += `<div style="color:#64748b;font-size:12px;margin-top:4px">暂无图片</div>`;
          }
        }

        tip.innerHTML = html;
        tip.style.opacity = '1';
        let left = event.clientX + 16;
        let top = event.clientY - 40;
        if (left + 420 > window.innerWidth) left = event.clientX - 420;
        if (top + 250 > window.innerHeight) top = window.innerHeight - 270;
        tip.style.left = left + 'px';
        tip.style.top = top + 'px';
      }

      function hideTooltip() {
        document.getElementById('tooltip').style.opacity = '0';
      }

      // ===== DETAIL PANEL =====
      function showDetailPanel(d) {
        const panel = document.getElementById('detail-panel');
        const content = document.getElementById('detail-content');

        let imgsHtml = '';
        if (d.data.images && d.data.images.length > 0) {
          imgsHtml = d.data.images
            .map(
              (img, i) =>
                `<div class="img-card" onclick="openLightbox('${img}')">
        <img src="${img}" alt="" loading="lazy"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
        <div style="display:none;width:118px;height:85px;background:rgba(30,41,59,0.8);align-items:center;justify-content:center;border-radius:4px;margin-bottom:4px;color:#64748b;font-size:11px;">图片加载失败</div>
        <div class="lab">#${i + 1}</div>
      </div>`
            )
            .join('');
        } else {
          imgsHtml =
            "<div style='color:#64748b;padding:24px;text-align:center;font-size:14px'>暂无图片，待补充</div>";
        }

        // Breadcrumb
        let breadcrumb = [];
        let p = d;
        while (p) {
          breadcrumb.unshift(p.data.name);
          p = p.parent;
        }

        content.innerHTML = `
    <h3 style="color:${d.data.color}">${d.data.name}</h3>
    <div class="desc">${breadcrumb.join(' \u2192 ')}</div>
    <div style="color:#64748b;font-size:12px;margin-bottom:10px">共 ${d.data.images ? d.data.images.length : 0} 张图片</div>
    <div class="img-grid">${imgsHtml}</div>
  `;

        panel.classList.add('open');
        document.getElementById('detail-backdrop').classList.add('active');
      }

      // Close panel (unified)
      function closeDetailPanel() {
        document.getElementById('detail-panel').classList.remove('open');
        document.getElementById('detail-backdrop').classList.remove('active');
      }

      // Lightbox for full image
      function openLightbox(src) {
        const overlay = document.createElement('div');
        overlay.style.cssText =
          'position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:pointer;';
        overlay.innerHTML = `<img src="${src}" style="max-width:90vw;max-height:90vh;object-fit:contain;border-radius:8px;box-shadow:0 0 40px rgba(0,0,0,0.5)">`;
        overlay.onclick = () => overlay.remove();
        document.body.appendChild(overlay);
      }

      // Close panel
      document.getElementById('close-panel').addEventListener('click', closeDetailPanel);
      document.getElementById('detail-backdrop').addEventListener('click', closeDetailPanel);

      // ===== BUTTONS =====
      function zoomScale(s) {
        const t = d3.zoomTransform(svg.node());
        svg
          .transition()
          .duration(300)
          .call(
            d3
              .zoom()
              .scaleExtent([0.1, 4])
              .on('zoom', (ev) => g.attr('transform', ev.transform)).transform,
            d3.zoomIdentity.translate(t.x, t.y).scale(t.k * s)
          );
      }

      document.getElementById('btn-zoom-in').addEventListener('click', () => zoomScale(1.3));
      document.getElementById('btn-zoom-out').addEventListener('click', () => zoomScale(0.7));

      document.getElementById('btn-fit').addEventListener('click', () => {
        const bounds = g.node().getBBox();
        const scale = 0.85 / Math.max(bounds.width / W, bounds.height / H);
        const tx = W / 2 - scale * (bounds.x + bounds.width / 2);
        const ty = H / 2 - scale * (bounds.y + bounds.height / 2);
        svg
          .transition()
          .duration(750)
          .call(
            d3
              .zoom()
              .scaleExtent([0.1, 4])
              .on('zoom', (ev) => g.attr('transform', ev.transform)).transform,
            d3.zoomIdentity.translate(tx, ty).scale(scale)
          );
      });

      document.getElementById('btn-expand-all').addEventListener('click', function () {
        root.descendants().forEach((d) => {
          if (d._children) {
            d.children = d._children;
            d._children = null;
          }
        });
        update(root);
      });

      document.getElementById('btn-collapse-species').addEventListener('click', function () {
        root.descendants().forEach((d) => {
          if (d.depth >= 3 && d.children) {
            d._children = d.children;
            d.children = null;
          }
        });
        update(root);
      });

      document.getElementById('btn-reset').addEventListener('click', () => {
        // Collapse all first
        root.descendants().forEach((d) => {
          if (d.depth >= 2 && d.children) {
            d._children = d.children;
            d.children = null;
          }
        });
        // Then expand only Outgroup
        root.descendants().forEach((d) => {
          if (d.depth >= 2 && d._children) {
            const anc = findCladeAncestor(d);
            if (anc && anc.data.shortName === 'Outgroup') {
              d.children = d._children;
              d._children = null;
            }
          }
        });
        update(root);

        // Reset zoom
        svg
          .transition()
          .duration(500)
          .call(
            d3
              .zoom()
              .scaleExtent([0.1, 4])
              .on('zoom', (ev) => g.attr('transform', ev.transform)).transform,
            d3.zoomIdentity
          );
        closeDetailPanel();
      });

      // Keyboard
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeDetailPanel();
        }
      });

      // Fix SVG image clipping
      const defs = svg.append('defs');
      defs
        .append('clipPath')
        .attr('id', 'cardClip')
        .append('rect')
        .attr('x', -IMG_W / 2)
        .attr('y', -CARD_H / 2 + 3)
        .attr('width', IMG_W)
        .attr('height', IMG_H)
        .attr('rx', 4)
        .attr('ry', 4);

      // ===== INITIAL RENDER =====
      root.x0 = H / 2;
      root.y0 = 100;
      update(root);

      // Hide loading overlay after render
      var overlay = document.getElementById('loading-overlay');
      if (overlay) {
        overlay.style.opacity = '0';
        overlay.style.pointerEvents = 'none';
        setTimeout(function () {
          overlay.style.display = 'none';
        }, 500);
      }

      // Fallback: force hide after 5s
      setTimeout(function () {
        var ol = document.getElementById('loading-overlay');
        if (ol && ol.style.display !== 'none') {
          ol.style.opacity = '0';
          ol.style.pointerEvents = 'none';
          ol.style.display = 'none';
        }
      }, 5000);
    </script>
  </body>
</html>
